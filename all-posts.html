  <script src="script.js"></script>
  <script>
    (function () {
      const PER_PAGE = 10;

      function qs(name, defaultValue) {
        try {
          const params = new URLSearchParams(location.search);
          return params.get(name) || defaultValue;
        } catch (e) {
          return defaultValue;
        }
      }

      function renderYearFilters(years, yearsMap, selectedYear) {
        const container = document.getElementById('year-filters');
        if (!container) return;
        const parts = [];
        const allActive = (selectedYear === 'all');
        parts.push(`<a href="all-posts.html?page=1&year=all" style="${allActive ? 'font-weight:700' : ''}">All (${Object.keys(yearsMap).reduce((s,y)=>s+yearsMap[y].length,0)})</a>`);
        years.forEach(y => {
          const active = String(y) === String(selectedYear);
          parts.push(`<a href="all-posts.html?page=1&year=${y}" style="${active ? 'font-weight:700' : ''}">${y} (${yearsMap[y].length})</a>`);
        });
        container.innerHTML = parts.join(' ');
      }

      function renderPosts(posts, page, year) {
        const list = document.getElementById('all-posts-list');
        const pagination = document.getElementById('pagination');
        if (!list || !pagination) return;

        const total = posts.length;
        const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
        page = Math.min(Math.max(1, page), totalPages);

        const start = (page - 1) * PER_PAGE;
        const slice = posts.slice(start, start + PER_PAGE);

        list.innerHTML = slice.map(p => `
          <li>
            <a href="${p.url}">${p.title}</a>
            <div class="date"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><time>${p.formattedDate}</time></div>
            <p>${p.excerpt}</p>
          </li>
        `).join('');

        // build pagination controls
        const parts = [];
        const yearParam = year ? `&year=${year}` : '';
        if (page > 1) {
          parts.push(`<a class="btn" href="all-posts.html?page=${page-1}${yearParam}">Prev</a>`);
        }

        // show a compact range of pages (e.g., first, prev 2, current, next 2, last)
        const maxPagesToShow = 7;
        let startPage = Math.max(1, page - 3);
        let endPage = Math.min(totalPages, startPage + maxPagesToShow - 1);
        if (endPage - startPage < maxPagesToShow - 1) {
          startPage = Math.max(1, endPage - maxPagesToShow + 1);
        }

        if (startPage > 1) {
          parts.push(`<a href="all-posts.html?page=1${yearParam}">1</a>`);
          if (startPage > 2) parts.push(`<span style="padding:.5rem">…</span>`);
        }

        for (let i = startPage; i <= endPage; i++) {
          if (i === page) {
            parts.push(`<span aria-current="page" style="padding:.5rem;font-weight:700">${i}</span>`);
          } else {
            parts.push(`<a href="all-posts.html?page=${i}${yearParam}">${i}</a>`);
          }
        }

        if (endPage < totalPages) {
          if (endPage < totalPages - 1) parts.push(`<span style="padding:.5rem">…</span>`);
          parts.push(`<a href="all-posts.html?page=${totalPages}${yearParam}">${totalPages}</a>`);
        }

        if (page < totalPages) {
          parts.push(`<a class="btn" href="all-posts.html?page=${page+1}${yearParam}">Next</a>`);
        }

        pagination.innerHTML = parts.join(' ');
      }

      async function init() {
        try {
          // use global fetchPosts() from script.js (caches)
          const posts = await fetchPosts();
          if (!posts || !posts.length) return;

          // build years map
          const yearsMap = {};
          posts.forEach(p => {
            const y = (new Date(p.date)).getFullYear();
            if (!yearsMap[y]) yearsMap[y] = [];
            yearsMap[y].push(p);
          });

          const years = Object.keys(yearsMap).sort((a,b) => b - a); // newest first

          const selectedYear = qs('year', 'all');
          const page = parseInt(qs('page', '1'), 10) || 1;

          renderYearFilters(years, yearsMap, selectedYear);

          let list = posts;
          if (selectedYear && selectedYear !== 'all' && yearsMap[selectedYear]) {
            list = yearsMap[selectedYear];
          }

          // ensure list stays sorted newest-first (posts sorted by build)
          renderPosts(list, page, selectedYear === 'all' ? null : selectedYear);
        } catch (e) {
          console.error('Could not load posts index', e);
        }
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
