<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>%%TITLE%% | %%SITE_NAME%%</title>
  <meta name="description" content="%%DESCRIPTION%%">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="%%ASSET_PATH%%style.css">
  <!-- Highlight.js themes (light/dark) -->
  <link id="code-theme-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
  <link id="code-theme-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <script>
    // Set theme before paint
    (function () {
      var t = localStorage.getItem("theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <a href="#main-content" class="skip">Skip to content</a>

  <header>
    <div class="wrap header-inner">
      <a href="%%ASSET_PATH%%index.html" class="logo">%%SITE_NAME%%</a>
      <nav id="nav" aria-label="Main">
        <button id="menu-btn" class="icon-btn menu-btn" aria-label="Open menu" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path class="open" d="M3 6h18M3 12h18M3 18h18"/><path class="close" d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <ul id="menu">
          <li><a href="%%ASSET_PATH%%index.html#posts">Posts</a></li>
          <li><a href="%%ASSET_PATH%%about.html">About</a></li>
          <li>
            <a href="#" class="icon-btn" aria-label="Search" title="Search">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </a>
          </li>
          <li>
            <button id="theme-btn" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
              <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
              <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
          </li>
        </ul>
      </nav>
    </div>
    <div class="wrap"><hr></div>
  </header>

  <main id="main-content" class="wrap page">
    <nav class="breadcrumb" aria-label="Breadcrumb"></nav>

    <h1 class="page-title">%%TITLE%%</h1>

    <div class="prose">
      <div class="date">Published: <time>%%DATE%%</time></div>
      %%CONTENT%%
    </div>
  </main>

  <footer>
    <div class="wrap"><hr></div>
    <div class="wrap footer-inner">
      %%SOCIALS%%
      <div class="copy">Copyright &copy; <span id="year">2026</span> &nbsp;—&nbsp; solar-song &nbsp;|&nbsp; All rights reserved.</div>
    </div>
  </footer>

  <script>window.__SITE_BASE = "%%ASSET_PATH%%";</script>
  <script src="%%ASSET_PATH%%script.js"></script>
</body>
</html>
